services:

  dev:
    build:
      context: .
      dockerfile: Dockerfile

    image: thulija-platform-dev

    container_name: thulija-platform-dev
    hostname: thulija-platform-dev

    volumes:
      - ../../thulijaplatform:/workspace/thulijaplatform

    working_dir: /workspace/thulijaplatform

    ports:
      - "4200:4200"
      - "8888:8888"
      - "5005:5005"

    depends_on:
      mysql:
        condition: service_healthy

    stdin_open: true
    tty: true

  mysql:
    image: mysql:8.4

    container_name: thulija-platform-mysql
    hostname: thulija-platform-mysql

    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: xs2p0rt4l
      MYSQL_DATABASE: thulijac_coding_studio

    ports:
      - "3306:3306"

    volumes:
      - mysql-data:/var/lib/mysql
      - ../../thulijaplatform/tcodegen/database/tcodegen.sql:/docker-entrypoint-initdb.d/tcodegen.sql:ro

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-p$$MYSQL_ROOT_PASSWORD"
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  mysql-data:
